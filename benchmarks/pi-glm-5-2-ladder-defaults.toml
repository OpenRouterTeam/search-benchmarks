# GLM 5.2 Nitro via Pi + OpenRouter defaults, search surface ladder.
# Three engines only: Exa default, Parallel default, Perplexity default.
# Surfaces: plugin, 1-turn, 5-turn, 25-turn. Exa 4k and 3-turn are
# intentionally excluded from this ladder.
#
#   uv run python scripts/benchmark_report.py sweep --spec benchmarks/pi-glm-5-2-ladder-defaults.toml --dry-run

[sweep]
system = [
  "pi-openrouter-plugin-defaults-glm-5-2-nitro-exa",
  "pi-openrouter-plugin-defaults-glm-5-2-nitro-parallel",
  "pi-openrouter-plugin-defaults-glm-5-2-nitro-perplexity",
  "pi-openrouter-web-search-1call-defaults-glm-5-2-nitro-exa",
  "pi-openrouter-web-search-1call-defaults-glm-5-2-nitro-parallel",
  "pi-openrouter-web-search-1call-defaults-glm-5-2-nitro-perplexity",
  "pi-openrouter-web-search-5call-defaults-glm-5-2-nitro-exa",
  "pi-openrouter-web-search-5call-defaults-glm-5-2-nitro-parallel",
  "pi-openrouter-web-search-5call-defaults-glm-5-2-nitro-perplexity",
  "pi-openrouter-web-search-25call-defaults-glm-5-2-nitro-exa",
  "pi-openrouter-web-search-25call-defaults-glm-5-2-nitro-parallel",
  "pi-openrouter-web-search-25call-defaults-glm-5-2-nitro-perplexity",
]
report_system = [
  "pi-openrouter-plugin-defaults-glm-5-2-nitro-exa",
  "pi-openrouter-plugin-defaults-glm-5-2-nitro-parallel",
  "pi-openrouter-plugin-defaults-glm-5-2-nitro-perplexity",
  "pi-openrouter-web-search-1call-defaults-glm-5-2-nitro-exa",
  "pi-openrouter-web-search-1call-defaults-glm-5-2-nitro-parallel",
  "pi-openrouter-web-search-1call-defaults-glm-5-2-nitro-perplexity",
  "pi-openrouter-web-search-5call-defaults-glm-5-2-nitro-exa",
  "pi-openrouter-web-search-5call-defaults-glm-5-2-nitro-parallel",
  "pi-openrouter-web-search-5call-defaults-glm-5-2-nitro-perplexity",
  "pi-openrouter-web-search-25call-defaults-glm-5-2-nitro-exa",
  "pi-openrouter-web-search-25call-defaults-glm-5-2-nitro-parallel",
  "pi-openrouter-web-search-25call-defaults-glm-5-2-nitro-perplexity",
]
sample = 100
sample_seed = 0
parallel_cells = 2
concurrency = 5
task_timeout = 1200
run_suffix = "pi-glm-5-2-evalkey-clean"
report_bench = ["pi-glm-5-2-evalkey-clean"]
budget_usd = 1000
png = true
save_latest = true
title = "Pi + GLM 5.2 Search Engine Benchmark"
note = "GLM 5.2 Nitro through the Pi agent and OpenRouter web search. Compares Exa, Parallel, and Perplexity at plugin, 1-turn, 5-turn, and 25-turn search depths on 100 seeded tasks per suite. Search only; page fetch and code tools are disabled."
