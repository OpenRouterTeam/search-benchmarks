# GLM 5.1 / Exa 25-call no-totalcap rerun with max_characters=4000.
# Same seeded ~100/suite sweep as the glm-v1 Exa optimized-default rerun,
# but caps each Exa result's content/highlights payload at 4k characters.
#
#   uv run python scripts/benchmark_report.py sweep --spec benchmarks/glm-exa-4k.toml [--dry-run]

[sweep]
system = ["openrouter-web-search-25call-no-totalcap-4k-glm-5-1-exa"]
sample = 100
sample_seed = 0
parallel_cells = 4
concurrency = 100
task_timeout = 1200
run_suffix = "glm-v1-exa-4k"
budget_usd = 150
png = true
save_latest = false
cost_per_task = 0.25
title = "Search Engine Benchmark — glm-5.1 Exa 25-call, 4k chars/result"
note = "glm-5.1 on Exa only, 25-call server-tool route, max_total_results unset, max_results_per_search=10, and max_characters=4000. Same seed-0 ~100-task/suite sample as glm-v1 so it compares directly against the Exa optimized-default no-totalcap rerun. Search-only: web_fetch remains off."
