# GLM 5.2 Nitro via Hermes Agent + OpenRouter web-search server tool.
# Matches the prior GLM 5.1 25-call engine lane as closely as possible:
# exa / parallel / perplexity x browsecomp, hle, dsqa, widesearch, sample 100.
# Hermes local web tools are disabled; search is OpenRouter's server-side
# openrouter:web_search using OPENROUTER_API_KEY only.
#
#   uv run python scripts/benchmark_report.py sweep --spec benchmarks/glm-5-2-hermes.toml --dry-run

[sweep]
system = [
  "hermes-openrouter-web-search-25call-glm-5-2-nitro-exa",
  "hermes-openrouter-web-search-25call-glm-5-2-nitro-parallel",
  "hermes-openrouter-web-search-25call-glm-5-2-nitro-perplexity",
]
sample = 100
sample_seed = 0
# Hermes + GLM 5.2 Nitro + OpenRouter server-side web search has a long
# streaming tail at high fanout. Keep the 25-call agent cap, but run fewer
# benchmark tasks at once so partial runs resume cleanly and avoid stale streams.
parallel_cells = 2
concurrency = 5
task_timeout = 1200
run_suffix = "glm-5-2"
report_bench = ["glm-5-2"]
budget_usd = 500
png = true
save_latest = false
cost_per_task = 0.25
title = "Search Engine Benchmark — GLM 5.2 Nitro via Hermes Agent (~100/suite)"
note = "GLM 5.2 Nitro through Hermes Agent with OpenRouter as the model runtime and OpenRouter server-side web search as the only web layer. Engines: Exa, Parallel, Perplexity. 25-call cap, max_results_per_search=10, max_total_results=100, ~100 tasks/suite, graded by openai/gpt-4.1. Uses OPENROUTER_API_KEY only; Hermes local web providers are disabled. Compare most directly to the prior GLM 5.1 25-call OpenRouter rows, with the caveat that this adds Hermes' agent loop/prompting around the OpenRouter call path."
