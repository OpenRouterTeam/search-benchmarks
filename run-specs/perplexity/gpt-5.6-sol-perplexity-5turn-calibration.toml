version = 1
title = "GPT-5.6 Sol with Perplexity search, 5-turn calibration"
description = "One task per suite to measure cost before the 100-task run."
model = "openai/gpt-5.6-sol"
suites = ["browsecomp", "dsqa", "widesearch"]
start = 0
limit = 1
epochs = 1
concurrency = 2
chunk_size = 1

[inference]
temperature = 0
max_retries = 10
provider_only = ["OpenAI"]
allow_fallbacks = false

[search]
surface = "server-tool"
engine = "perplexity"
max_agent_turns = 5

[publish]
include_inputs = false
include_answers = false
include_search_queries = false
