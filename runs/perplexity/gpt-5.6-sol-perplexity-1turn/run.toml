version = 1
title = "GPT-5.6 Sol with Perplexity search, 1 turn"
description = "Three-suite OpenRouter search benchmark at a one-turn search budget."
model = "openai/gpt-5.6-sol"
suites = ["browsecomp", "dsqa", "widesearch"]
start = 0
limit = 100
epochs = 1
concurrency = 2
chunk_size = 10
budget_usd = 110

# Add budget_usd and measured [cost_estimates] after a one-task calibration.
[inference]
temperature = 0
max_retries = 10
provider_only = ["OpenAI"]
allow_fallbacks = false

[search]
surface = "server-tool"
engine = "perplexity"
max_agent_turns = 1

# Measured from gpt-5.6-sol-perplexity-1turn-calibration-maxuses (one task per
# suite). The budget allows roughly 4x the one-task planning estimate.
[cost_estimates]
browsecomp = 0.05744125
dsqa = 0.07090035
widesearch = 0.123123

[publish]
include_inputs = false
include_answers = false
include_search_queries = false
