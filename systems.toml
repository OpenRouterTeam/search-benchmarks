# Search-surface ladder matrices for the headline benchmark: gpt-5.4-nano
# (pathfinder), z-ai/glm-5.1, and nvidia/nemotron-3-ultra-550b-a55b across
# plugin -> 1-call -> 3-call -> 25-call x exa/parallel/perplexity. See
# GLM_PLAN.md / NEMOTRON_PLAN.md / BENCHMARK_PLAN_V2.md.
#
# max_characters is left unset everywhere so each engine returns its native
# content shape (exa ~2-4K highlights, parallel ~1.5K, perplexity its own
# budget) — matching what a default openrouter:web_search user gets.

# ---------------------------------------------------------------------------
# nano server-tool matrix (3-call default) — pathfinder lane
# ---------------------------------------------------------------------------
[openrouter_matrices.web_search_engines]
system_prefix = "openrouter-web-search"
engines = ["auto", "exa", "native", "parallel", "firecrawl", "perplexity"]

[openrouter_matrices.web_search_engines.defaults]
reasoning_effort = "high"
max_output_tokens = 128000
web_search = "server-tool"
max_results_per_search = 10
max_total_results = 100
max_tool_calls = 3

[[openrouter_matrices.web_search_engines.models]]
id = "openai/gpt-5.4-nano"
name = "gpt-5-4-nano"

# nano 1-call: exactly one model-authored search. plugin-vs-1call isolates
# query quality; 1call->3call->25call isolates search depth.
[openrouter_matrices.web_search_engines_1call]
system_prefix = "openrouter-web-search-1call"
engines = ["exa", "perplexity"]

[openrouter_matrices.web_search_engines_1call.defaults]
reasoning_effort = "high"
max_output_tokens = 128000
web_search = "server-tool"
max_results_per_search = 10
max_total_results = 100
max_tool_calls = 1

[[openrouter_matrices.web_search_engines_1call.models]]
id = "openai/gpt-5.4-nano"
name = "gpt-5-4-nano"

# 25-call: the server-tool hard cap (best effort). nano, glm-5.1, nemotron.
# glm/nemotron pin fast providers — the 25-call loop runs 12-15 sequential
# generations/task, so a slow endpoint blows the per-attempt timeout.
[openrouter_matrices.web_search_engines_25call]
system_prefix = "openrouter-web-search-25call"
engines = ["exa", "parallel", "perplexity"]

[openrouter_matrices.web_search_engines_25call.defaults]
reasoning_effort = "high"
max_output_tokens = 128000
web_search = "server-tool"
max_results_per_search = 10
max_total_results = 100
max_tool_calls = 25

[[openrouter_matrices.web_search_engines_25call.models]]
id = "openai/gpt-5.4-nano"
name = "gpt-5-4-nano"

[[openrouter_matrices.web_search_engines_25call.models]]
id = "z-ai/glm-5.1"
name = "glm-5-1"
provider_order = ["baseten", "parasail", "deepinfra", "atlascloud", "chutes"]
provider_allow_fallbacks = true

[[openrouter_matrices.web_search_engines_25call.models]]
id = "nvidia/nemotron-3-ultra-550b-a55b"
name = "nemotron-3-ultra"
provider_order = ["deepinfra", "together"]
provider_allow_fallbacks = true

